name: Offline plugin checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-qwen-v2.mjs
      - run: git diff --exit-code -- plugins/tasks/alibaba/1.3.1-qwen.2/runtime.fixture.json
